name: Verify methodology and site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify contracts, content, types, links, and production build
        run: npm test

      - name: Install Chromium for browser checks
        # GitHub's runner image already carries the Chromium runtime libraries.
        # Avoid apt mirror outages turning a browser download into a ten-minute hang.
        run: npx playwright install chromium

      - name: Verify responsive interaction and accessibility
        run: npm run test:e2e

      - name: Audit production and development dependencies
        run: npm audit
