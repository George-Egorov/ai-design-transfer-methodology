        <text x="24" y="69" fill="#1E1E1E" font-size="18" font-weight="700">STRUCTURE</text>
      </g>
      <g transform="translate(196)">
        <rect width="176" height="96" rx="16" fill="#283137"/>
        <rect width="7" height="96" rx="3.5" fill="#FFFFFF"/>
        <text x="24" y="38" fill="#70C3FF" font-family="Courier New, monospace" font-size="12">02</text>
        <text x="24" y="69" fill="#FFFFFF" font-size="18" font-weight="700">DATA</text>
      </g>
      <g transform="translate(0 116)">
        <rect width="176" height="96" rx="16" fill="#283137"/>
        <rect width="7" height="96" rx="3.5" fill="#FFFFFF"/>
        <text x="24" y="38" fill="#70C3FF" font-family="Courier New, monospace" font-size="12">03</text>
        <text x="24" y="69" fill="#FFFFFF" font-size="18" font-weight="700">STATE</text>
      </g>
      <g transform="translate(196 116)">
        <rect width="176" height="96" rx="16" fill="#FFFFFF"/>
        <rect width="7" height="96" rx="3.5" fill="#0D99FF"/>
        <text x="24" y="38" fill="#006FC4" font-family="Courier New, monospace" font-size="12">04</text>
        <text x="24" y="69" fill="#1E1E1E" font-size="18" font-weight="700">RESPONSIVE</text>
      </g>
      <g transform="translate(0 232)">
        <rect width="176" height="96" rx="16" fill="#FFFFFF"/>
        <rect width="7" height="96" rx="3.5" fill="#0D99FF"/>
        <text x="24" y="38" fill="#006FC4" font-family="Courier New, monospace" font-size="12">05</text>
        <text x="24" y="69" fill="#1E1E1E" font-size="18" font-weight="700">MOTION</text>
      </g>
      <g transform="translate(196 232)">
        <rect width="176" height="96" rx="16" fill="#283137"/>
        <rect width="7" height="96" rx="3.5" fill="#FFFFFF"/>
        <text x="24" y="38" fill="#70C3FF" font-family="Courier New, monospace" font-size="12">06</text>
