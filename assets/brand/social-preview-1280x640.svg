<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">BRIDGE — no blind spots between design and implementation</title>
  <desc id="desc">The BRIDGE mark, product statement, and six contract areas: structure, data, state, responsive behavior, motion, and accessibility.</desc>
  <rect width="1280" height="640" fill="#FBFCFD"/>
  <path d="M0 76H1280M0 564H1280M76 0V640M1204 0V640" stroke="#E3E9ED"/>

  <g transform="translate(76 60)" font-family="Arial, sans-serif">
    <g>
      <rect width="58" height="58" rx="13" fill="#1E1E1E"/>
      <rect x="13" y="12" width="16" height="9" rx="1.5" fill="#0D99FF"/>
      <path d="M32 12h6a9 9 0 0 1 9 9H32V12Z" fill="#FFFFFF"/>
      <rect x="13" y="25" width="16" height="9" rx="1.5" fill="#FFFFFF"/>
      <path d="M32 25h6a9 9 0 0 1 9 9H32V25Z" fill="#0D99FF"/>
      <rect x="13" y="38" width="16" height="9" rx="1.5" fill="#0D99FF"/>
      <path d="M32 38h6a9 9 0 0 1 9 9H32V38Z" fill="#FFFFFF"/>
      <text x="78" y="40" fill="#1E1E1E" font-size="32" font-weight="700">BRIDGE</text>
    </g>

    <text x="0" y="155" fill="#006FC4" font-family="Courier New, monospace" font-size="14" font-weight="700" letter-spacing="2.4">OPEN DESIGN HANDOFF METHODOLOGY</text>
    <text x="0" y="224" fill="#1E1E1E" font-size="57" font-weight="700">
      <tspan x="0" dy="0">No blind spots</tspan>
      <tspan x="0" dy="63">between design and</tspan>
      <tspan x="0" dy="63">implementation.</tspan>
    </text>
    <text x="0" y="459" fill="#5C6874" font-size="20">Native Figma truth + explicit product intent + review evidence.</text>
  </g>

  <g transform="translate(760 76)" font-family="Arial, sans-serif">
