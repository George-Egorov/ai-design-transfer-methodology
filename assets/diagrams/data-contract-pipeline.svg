<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">BRIDGE data display pipeline</title><desc id="desc">A five-stage data contract from source and semantics through transformations, display, states, responsive behavior and accessible fallback.</desc>
  <style>text{font-family:Arial}
    .display{font-family:Arial;font-size:50px;font-weight:700;fill:#1E1E1E}.h{font-family:Arial;font-size:25px;font-weight:700;fill:#1E1E1E}.b{font-family:Arial;font-size:20px;font-weight:500;fill:#1E1E1E}.s{font-family:Arial;font-size:16px;font-weight:500;fill:#5C6874}.mono{font-family:Courier New;font-size:15px;font-weight:500;fill:#1E1E1E}.label{font-family:Courier New;font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#006FC4}.label-on-dark{font-family:Courier New;font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#70C3FF}.white{fill:#FFFFFF}.whiteh{font-family:Arial;font-size:25px;font-weight:700;fill:#FFFFFF}.whiteb{font-family:Arial;font-size:20px;font-weight:500;fill:#FFFFFF}.whitemono{font-family:Courier New;font-size:15px;font-weight:500;fill:#FFFFFF}.line{stroke:#DCE4E9;stroke-width:2;fill:none}.blue-line{stroke:#0D99FF;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="100%" height="100%" fill="#FBFCFD"/>
  <text x="80" y="88" class="label" text-anchor="start">DATA DISPLAY CONTRACT</text><text x="80" y="148" class="display" text-anchor="start">From source to equivalent experience.</text><text x="80" y="190" class="s" text-anchor="start">The chart is not the contract. Meaning, transformation, behavior and fallback are.</text><rect x="60" y="300" width="235" height="265" rx="24" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="84" y="340" class="label" text-anchor="start">01</text><text x="84" y="382" class="h" text-anchor="start">SOURCE</text><text x="84" y="432" class="b" text-anchor="start">API / CMS / analytics</text><text x="84" y="470" class="mono" text-anchor="start">asOf · timezone · provenance</text><path d="M295 432H321" class="blue-line"/><path d="M313 424L321 432L313 440" class="blue-line"/><rect x="335" y="300" width="235" height="265" rx="24" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="359" y="340" class="label" text-anchor="start">02</text><text x="359" y="382" class="h" text-anchor="start">MEANING</text><text x="359" y="432" class="b" text-anchor="start">dimensions · measures</text><text x="359" y="470" class="mono" text-anchor="start">units · null policy · format</text><path d="M570 432H596" class="blue-line"/><path d="M588 424L596 432L588 440" class="blue-line"/><rect x="610" y="300" width="235" height="265" rx="24" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="634" y="340" class="label" text-anchor="start">03</text><text x="634" y="382" class="h" text-anchor="start">TRANSFORM</text><text x="634" y="432" class="b" text-anchor="start">filter · group · sort</text><text x="634" y="470" class="mono" text-anchor="start">aggregate · calculate</text><path d="M845 432H871" class="blue-line"/><path d="M863 424L871 432L863 440" class="blue-line"/><rect x="885" y="300" width="235" height="265" rx="24" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="909" y="340" class="label" text-anchor="start">04</text><text x="909" y="382" class="h" text-anchor="start">DISPLAY</text><text x="909" y="432" class="b" text-anchor="start">chart · table · KPI</text><text x="909" y="470" class="mono" text-anchor="start">scales · axes · legend</text><path d="M1120 432H1146" class="blue-line"/><path d="M1138 424L1146 432L1138 440" class="blue-line"/><rect x="1160" y="300" width="235" height="265" rx="24" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="1184" y="340" class="label" text-anchor="start">05</text><text x="1184" y="382" class="h" text-anchor="start">EXPERIENCE</text><text x="1184" y="432" class="b" text-anchor="start">states · responsive · a11y</text><text x="1184" y="470" class="mono" text-anchor="start">keyboard · data-table fallback</text><rect x="80" y="640" width="1280" height="150" rx="26" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="115" y="685" class="label-on-dark" text-anchor="start">REQUIRED STATES</text><rect x="170" y="706" width="130" height="34" rx="17" fill="#283137"/><text x="235.0" y="728" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">loading</text><rect x="330" y="706" width="130" height="34" rx="17" fill="#283137"/><text x="395.0" y="728" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">empty</text><rect x="490" y="706" width="130" height="34" rx="17" fill="#283137"/><text x="555.0" y="728" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">error</text><rect x="650" y="706" width="130" height="34" rx="17" fill="#283137"/><text x="715.0" y="728" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">stale</text><rect x="810" y="706" width="130" height="34" rx="17" fill="#283137"/><text x="875.0" y="728" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">partial</text><rect x="970" y="706" width="130" height="34" rx="17" fill="#283137"/><text x="1035.0" y="728" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">permission</text><rect x="1160" y="706" width="130" height="34" rx="17" fill="#0F6043"/><text x="1225.0" y="728" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">ready</text><text x="80" y="850" class="mono" text-anchor="start">Evidence: sample records · long values · zero / negative · locale · narrow container</text>
</svg>