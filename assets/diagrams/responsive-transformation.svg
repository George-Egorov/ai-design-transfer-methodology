<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">BRIDGE responsive transformation</title><desc id="desc">A declared transformation maps a wide product grid to a narrow carousel while preserving identity, state, actions, order, keyboard behavior and focus.</desc>
  <style>text{font-family:Arial}
    .display{font-family:Arial;font-size:50px;font-weight:700;fill:#1E1E1E}.h{font-family:Arial;font-size:25px;font-weight:700;fill:#1E1E1E}.b{font-family:Arial;font-size:20px;font-weight:500;fill:#1E1E1E}.s{font-family:Arial;font-size:16px;font-weight:500;fill:#5C6874}.mono{font-family:Courier New;font-size:15px;font-weight:500;fill:#1E1E1E}.label{font-family:Courier New;font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#006FC4}.label-on-dark{font-family:Courier New;font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#70C3FF}.white{fill:#FFFFFF}.whiteh{font-family:Arial;font-size:25px;font-weight:700;fill:#FFFFFF}.whiteb{font-family:Arial;font-size:20px;font-weight:500;fill:#FFFFFF}.whitemono{font-family:Courier New;font-size:15px;font-weight:500;fill:#FFFFFF}.line{stroke:#DCE4E9;stroke-width:2;fill:none}.blue-line{stroke:#0D99FF;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="100%" height="100%" fill="#FBFCFD"/>
  <text x="80" y="88" class="label" text-anchor="start">DECLARED TRANSFORMATION</text><text x="80" y="148" class="display" text-anchor="start">Same meaning. Different pattern. Explicit mapping.</text><text x="80" y="190" class="s" text-anchor="start">Same tree is the default—not a reason to hide a legitimate responsive change.</text><rect x="80" y="260" width="490" height="410" rx="28" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="115" y="310" class="label" text-anchor="start">CONTAINER ≥ 960</text><text x="115" y="350" class="h" text-anchor="start">Product grid</text><rect x="115" y="385" width="120" height="90" rx="12" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="130" y="419" class="mono" text-anchor="start">item-1</text><rect x="130" y="436" width="70" height="8" rx="4" fill="#0D99FF"/><rect x="255" y="385" width="120" height="90" rx="12" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="270" y="419" class="mono" text-anchor="start">item-2</text><rect x="270" y="436" width="78" height="8" rx="4" fill="#0D99FF"/><rect x="395" y="385" width="120" height="90" rx="12" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="410" y="419" class="mono" text-anchor="start">item-3</text><rect x="410" y="436" width="86" height="8" rx="4" fill="#0D99FF"/><rect x="115" y="500" width="120" height="90" rx="12" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="130" y="534" class="mono" text-anchor="start">item-4</text><rect x="130" y="551" width="70" height="8" rx="4" fill="#0D99FF"/><rect x="255" y="500" width="120" height="90" rx="12" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="270" y="534" class="mono" text-anchor="start">item-5</text><rect x="270" y="551" width="78" height="8" rx="4" fill="#0D99FF"/><rect x="395" y="500" width="120" height="90" rx="12" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="410" y="534" class="mono" text-anchor="start">item-6</text><rect x="410" y="551" width="86" height="8" rx="4" fill="#0D99FF"/><rect x="115" y="620" width="220" height="34" rx="17" fill="#EAF6FF"/><text x="225.0" y="642" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#0D99FF">pattern: grid</text><path d="M595 455H835" class="blue-line"/><path d="M815 439L835 455L815 471" class="blue-line"/><rect x="625" y="395" width="180" height="34" rx="17" fill="#1E1E1E"/><text x="715.0" y="417" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">transform</text><text x="715" y="505" class="mono" text-anchor="middle">identity · state · focus</text><rect x="870" y="260" width="490" height="410" rx="28" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="905" y="310" class="label" text-anchor="start">CONTAINER &lt; 960</text><text x="905" y="350" class="h" text-anchor="start">Horizontal carousel</text><rect x="905" y="392" width="130" height="185" rx="14" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="920" y="434" class="mono" text-anchor="start">item-1</text><rect x="920" y="462" width="92" height="8" rx="4" fill="#0D99FF"/><rect x="920" y="484" width="70" height="8" rx="4" fill="#DCE4E9"/><rect x="1055" y="392" width="130" height="185" rx="14" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="1070" y="434" class="mono" text-anchor="start">item-2</text><rect x="1070" y="462" width="92" height="8" rx="4" fill="#0D99FF"/><rect x="1070" y="484" width="70" height="8" rx="4" fill="#DCE4E9"/><rect x="1205" y="392" width="130" height="185" rx="14" fill="#F2F6F8" stroke="#DCE4E9" stroke-width="2"/><text x="1220" y="434" class="mono" text-anchor="start">item-3</text><rect x="1220" y="462" width="92" height="8" rx="4" fill="#0D99FF"/><rect x="1220" y="484" width="70" height="8" rx="4" fill="#DCE4E9"/><rect x="905" y="620" width="245" height="34" rx="17" fill="#EAF6FF"/><text x="1027.5" y="642" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#0D99FF">pattern: carousel</text><rect x="80" y="735" width="1280" height="95" rx="20" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="110" y="775" class="label-on-dark" text-anchor="start">PRESERVE</text><text x="255" y="775" class="white" text-anchor="start">content identity</text><text x="480" y="775" class="white" text-anchor="start">selected item</text><text x="685" y="775" class="white" text-anchor="start">actions</text><text x="850" y="775" class="white" text-anchor="start">reading order</text><text x="1080" y="775" class="white" text-anchor="start">keyboard + focus</text>
</svg>