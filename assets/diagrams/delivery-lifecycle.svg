<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">BRIDGE delivery lifecycle</title><desc id="desc">A closed loop from design through declaration, preflight, implementation and design QA to accepted deviations and methodology learning.</desc>
  <style>text{font-family:Arial}
    .display{font-family:Arial;font-size:50px;font-weight:700;fill:#1E1E1E}.h{font-family:Arial;font-size:25px;font-weight:700;fill:#1E1E1E}.b{font-family:Arial;font-size:20px;font-weight:500;fill:#1E1E1E}.s{font-family:Arial;font-size:16px;font-weight:500;fill:#5C6874}.mono{font-family:Courier New;font-size:15px;font-weight:500;fill:#1E1E1E}.label{font-family:Courier New;font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#006FC4}.label-on-dark{font-family:Courier New;font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#70C3FF}.white{fill:#FFFFFF}.whiteh{font-family:Arial;font-size:25px;font-weight:700;fill:#FFFFFF}.whiteb{font-family:Arial;font-size:20px;font-weight:500;fill:#FFFFFF}.whitemono{font-family:Courier New;font-size:15px;font-weight:500;fill:#FFFFFF}.line{stroke:#DCE4E9;stroke-width:2;fill:none}.blue-line{stroke:#0D99FF;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="100%" height="100%" fill="#FBFCFD"/>
  <text x="80" y="88" class="label" text-anchor="start">DELIVERY LIFECYCLE</text><text x="80" y="148" class="display" text-anchor="start">The contract survives implementation.</text><text x="80" y="190" class="s" text-anchor="start">Readiness is not the finish line: decisions, evidence and deviations stay traceable.</text><g transform="translate(0 55)"><path d="M170 455C170 270 360 245 720 245C1080 245 1270 270 1270 455C1270 640 1080 665 720 665C360 665 170 640 170 455Z" stroke="#DCE4E9" stroke-width="8" fill="none"/><circle cx="200" cy="330" r="76" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4"/><text x="200" y="315" class="label" text-anchor="middle">01</text><text x="200" y="346" class="h" text-anchor="middle">DESIGN</text><text x="200" y="373" class="s" text-anchor="middle">native truth</text><circle cx="510" cy="250" r="76" fill="#FFFFFF" stroke="#0D99FF" stroke-width="4"/><text x="510" y="235" class="label" text-anchor="middle">02</text><text x="510" y="266" class="h" text-anchor="middle">DECLARE</text><text x="510" y="293" class="s" text-anchor="middle">intent + metadata</text><circle cx="890" cy="250" r="76" fill="#FFFFFF" stroke="#0D99FF" stroke-width="4"/><text x="890" y="235" class="label" text-anchor="middle">03</text><text x="890" y="266" class="h" text-anchor="middle">PREFLIGHT</text><text x="890" y="293" class="s" text-anchor="middle">rules + evidence</text><circle cx="1160" cy="430" r="76" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4"/><text x="1160" y="415" class="label" text-anchor="middle">04</text><text x="1160" y="446" class="h" text-anchor="middle">IMPLEMENT</text><text x="1160" y="473" class="s" text-anchor="middle">adapter profile</text><circle cx="850" cy="615" r="76" fill="#FFFFFF" stroke="#0D99FF" stroke-width="4"/><text x="850" y="600" class="label" text-anchor="middle">05</text><text x="850" y="631" class="h" text-anchor="middle">DESIGN QA</text><text x="850" y="658" class="s" text-anchor="middle">compare behavior</text><circle cx="430" cy="615" r="76" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4"/><text x="430" y="600" class="label" text-anchor="middle">06</text><text x="430" y="631" class="h" text-anchor="middle">LEARN</text><text x="430" y="658" class="s" text-anchor="middle">accepted deviations</text><path d="M335 265l18 2-10 15" fill="none" stroke="#0D99FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1070 285l17 8-15 11" fill="none" stroke="#0D99FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1180 560l-4 18-14-12" fill="none" stroke="#0D99FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 660l-18-2 10-15" fill="none" stroke="#0D99FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 520l-8-17 16 4" fill="none" stroke="#0D99FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="390" width="480" height="125" rx="22" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="720" y="430" class="label-on-dark" text-anchor="middle">VERSIONED SNAPSHOT</text><text x="720" y="470" class="whiteb" text-anchor="middle">open questions · owner · evidence</text><text x="720" y="498" class="whitemono" text-anchor="middle">change log · exception status</text></g><text x="80" y="840" class="mono" text-anchor="start">A deviation is not hidden: record → approve → review date → feed back into the contract</text>
</svg>