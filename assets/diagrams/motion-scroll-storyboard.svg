<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">BRIDGE scroll motion storyboard</title><desc id="desc">A four-scene scroll timeline with explicit tracks and a static reduced-motion fallback.</desc>
  <style>text{font-family:Arial}
    .display{font-family:Arial;font-size:50px;font-weight:700;fill:#1E1E1E}.h{font-family:Arial;font-size:25px;font-weight:700;fill:#1E1E1E}.b{font-family:Arial;font-size:20px;font-weight:500;fill:#1E1E1E}.s{font-family:Arial;font-size:16px;font-weight:500;fill:#5C6874}.mono{font-family:Courier New;font-size:15px;font-weight:500;fill:#1E1E1E}.label{font-family:Courier New;font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#006FC4}.label-on-dark{font-family:Courier New;font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#70C3FF}.white{fill:#FFFFFF}.whiteh{font-family:Arial;font-size:25px;font-weight:700;fill:#FFFFFF}.whiteb{font-family:Arial;font-size:20px;font-weight:500;fill:#FFFFFF}.whitemono{font-family:Courier New;font-size:15px;font-weight:500;fill:#FFFFFF}.line{stroke:#DCE4E9;stroke-width:2;fill:none}.blue-line{stroke:#0D99FF;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="100%" height="100%" fill="#FBFCFD"/>
  <text x="80" y="88" class="label" text-anchor="start">SCROLL STORYBOARD</text><text x="80" y="148" class="display" text-anchor="start">Progress is explicit. Content is never trapped.</text><text x="80" y="190" class="s" text-anchor="start">One source scroller · defined ranges · reversible scenes · reduced-motion alternative</text><path d="M130 370H1310" stroke="#DCE4E9" stroke-width="12" stroke-linecap="round"/><path d="M130 370H1040" stroke="#0D99FF" stroke-width="12" stroke-linecap="round"/><circle cx="160" cy="370" r="22" fill="#0D99FF" stroke="#0D99FF" stroke-width="5"/><rect x="35" y="235" width="250" height="95" rx="18" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="62" y="270" class="label" text-anchor="start">0–20%</text><text x="62" y="305" class="h" text-anchor="start">ENTRY</text><text x="160" y="430" class="s" text-anchor="middle">headline enters</text><circle cx="470" cy="370" r="22" fill="#0D99FF" stroke="#0D99FF" stroke-width="5"/><rect x="345" y="235" width="250" height="95" rx="18" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="372" y="270" class="label" text-anchor="start">20–55%</text><text x="372" y="305" class="h" text-anchor="start">PIN</text><text x="470" y="430" class="s" text-anchor="middle">comparison stays</text><circle cx="790" cy="370" r="22" fill="#0D99FF" stroke="#0D99FF" stroke-width="5"/><rect x="665" y="235" width="250" height="95" rx="18" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="692" y="270" class="label" text-anchor="start">55–80%</text><text x="692" y="305" class="h" text-anchor="start">REVEAL</text><text x="790" y="430" class="s" text-anchor="middle">result appears</text><circle cx="1110" cy="370" r="22" fill="#FFFFFF" stroke="#0D99FF" stroke-width="5"/><rect x="985" y="235" width="250" height="95" rx="18" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="1012" y="270" class="label" text-anchor="start">80–100%</text><text x="1012" y="305" class="h" text-anchor="start">RELEASE</text><text x="1110" y="430" class="s" text-anchor="middle">flow continues</text><rect x="80" y="520" width="800" height="250" rx="24" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><text x="110" y="565" class="label" text-anchor="start">TRACKS</text><text x="110" y="615" class="mono" text-anchor="start">hero-copy</text><rect x="310" y="599" width="500" height="12" rx="6" fill="#DCE4E9"/><rect x="310" y="599" width="170" height="12" rx="6" fill="#0D99FF"/><text x="830" y="615" class="s" text-anchor="end">0% → 100%</text><text x="110" y="663" class="mono" text-anchor="start">comparison</text><rect x="310" y="647" width="500" height="12" rx="6" fill="#DCE4E9"/><rect x="310" y="647" width="315" height="12" rx="6" fill="#0D99FF"/><text x="830" y="663" class="s" text-anchor="end">100% → 100%</text><text x="110" y="711" class="mono" text-anchor="start">result</text><rect x="310" y="695" width="500" height="12" rx="6" fill="#DCE4E9"/><rect x="310" y="695" width="460" height="12" rx="6" fill="#0D99FF"/><text x="830" y="711" class="s" text-anchor="end">0% → 100%</text><rect x="920" y="520" width="440" height="250" rx="24" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="2"/><text x="950" y="565" class="label-on-dark" text-anchor="start">REDUCED MOTION</text><text x="950" y="610" class="whiteh" text-anchor="start">STATIC</text><text x="950" y="650" class="whiteb" text-anchor="start">All text and actions remain.</text><text x="950" y="690" class="whitemono" text-anchor="start">No pin · no parallax · no loss</text><rect x="950" y="718" width="185" height="34" rx="17" fill="#0F6043"/><text x="1042.5" y="740" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#FFFFFF">required fallback</text><text x="80" y="845" class="mono" text-anchor="start">Back scroll: reverse · Re-entry: restore progress · Deep link: reveal final readable state</text>
</svg>