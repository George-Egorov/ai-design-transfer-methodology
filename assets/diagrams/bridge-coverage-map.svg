  <text x="80" y="90" class="label" text-anchor="start">NO BLIND SPOTS</text><text x="80" y="150" class="display" text-anchor="start">Six completeness checks.</text><text x="80" y="190" class="s" text-anchor="start">The BRIDGE principles are reviewed across the whole product experience</text><rect x="80" y="245" width="400" height="220" rx="28" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><rect x="80" y="245" width="10" height="220" rx="5" fill="#0D99FF"/><text x="116" y="295" class="label" text-anchor="start">01</text><text x="116" y="337" class="h" text-anchor="start">STRUCTURE</text><text x="116" y="377" class="b" text-anchor="start">Frames · hierarchy</text><text x="116" y="413" class="mono" text-anchor="start">[page] · [section]</text><circle cx="440" cy="287" r="13" fill="#16845B"/><path d="M434 287l4 4 8-9" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="520" y="245" width="400" height="220" rx="28" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><rect x="520" y="245" width="10" height="220" rx="5" fill="#1E1E1E"/><text x="556" y="295" class="label" text-anchor="start">02</text><text x="556" y="337" class="h" text-anchor="start">DATA</text><text x="556" y="377" class="b" text-anchor="start">Source · format</text><text x="556" y="413" class="mono" text-anchor="start">loading · empty · stale</text><circle cx="880" cy="287" r="13" fill="#16845B"/><path d="M874 287l4 4 8-9" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="960" y="245" width="400" height="220" rx="28" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><rect x="960" y="245" width="10" height="220" rx="5" fill="#1E1E1E"/><text x="996" y="295" class="label" text-anchor="start">03</text><text x="996" y="337" class="h" text-anchor="start">STATE</text><text x="996" y="377" class="b" text-anchor="start">Reactions · focus</text><text x="996" y="413" class="mono" text-anchor="start">guards · async · history</text><circle cx="1320" cy="287" r="1