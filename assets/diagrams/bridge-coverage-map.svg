<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">BRIDGE complete coverage map</title><desc id="desc">Six reviewed completeness areas: structure, data, state, responsive behavior, motion, and accessibility.</desc>
